<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>NEO百</title>
  <script>window.__appStart = Date.now();</script>

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NEO百">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;700;800&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./src/styles.css">

  <style>
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      overflow: hidden;
    }
    .splash-half {
      width: 50vw;
      height: 100vh;
      overflow: hidden;
      background: #ffffff;
      transition: transform 0.7s cubic-bezier(0.66, 0, 0.34, 1);
    }
    .splash-half-inner {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-right .splash-half-inner {
      margin-left: -50vw;
    }
    .splash-logo {
      height: 90vh;
      width: auto;
      max-width: 94vw;
    }
    #splash.open .splash-left {
      transform: translateX(-100%);
    }
    #splash.open .splash-right {
      transform: translateX(100%);
    }
    #splash.gone {
      display: none;
    }
  </style>

  <!-- React 18.2.0 - 開発ビルド(デバッグ中。原因特定後に production.min.js に戻す) -->
  <script crossorigin src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script type="module">
    import htm from 'https://unpkg.com/htm@3.1.1/dist/htm.module.js?module';
    window.htm = htm;
  </script>
</head>
<body>
  <div id="splash">
    <div class="splash-half splash-left">
      <div class="splash-half-inner"><img class="splash-logo" src="./splash.png" alt=""></div>
    </div>
    <div class="splash-half splash-right">
      <div class="splash-half-inner"><img class="splash-logo" src="./splash.png" alt=""></div>
    </div>
  </div>

  <div id="root">
    <div class="loading">
      <div class="loading-mark">帳</div>
      <div class="loading-text">読み込み中</div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>

  <script>
    // スプラッシュを必ず閉じる(main.js の状態に依存しない)
    (function closeSplash() {
      var splash = document.getElementById('splash');
      if (!splash) return;
      var MIN_SHOW = 2500;
      var start = window.__appStart || Date.now();
      var wait = Math.max(0, MIN_SHOW - (Date.now() - start));
      setTimeout(function () {
        splash.classList.add('open');
        setTimeout(function () { splash.classList.add('gone'); }, 750);
      }, wait);
    })();
  </script>

  <script>
    // Service Worker 登録 + 新バージョン検知バナー
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => {
            // すでに「待機中」のSWがあれば即バナー表示
            if (reg.waiting && navigator.serviceWorker.controller) {
              showUpdateBanner(reg.waiting);
            }
            // 新しいSWが見つかったら状態変化を見張る
            reg.addEventListener('updatefound', () => {
              const newWorker = reg.installing;
              if (!newWorker) return;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  showUpdateBanner(newWorker);
                }
              });
            });
          })
          .catch(err => console.warn('SW registration failed:', err));

        // SW が切り替わったら1回だけリロード
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      });
    }

    function showUpdateBanner(worker) {
      if (document.getElementById('updateBanner')) return;
      const bar = document.createElement('div');
      bar.id = 'updateBanner';
      bar.innerHTML =
        '<span class="ub-text">新しいバージョンがあります</span>' +
        '<button class="ub-btn" type="button">更新</button>';
      document.body.appendChild(bar);
      bar.querySelector('.ub-btn').addEventListener('click', () => {
        worker.postMessage({ type: 'SKIP_WAITING' });
      });
    }
  </script>
  <script>
    // ── デバッグ用エラー可視化(画面上に赤バーで表示) ──
    (function () {
      function showErr(msg) {
        var box = document.getElementById('debugErr');
        if (!box) {
          box = document.createElement('div');
          box.id = 'debugErr';
          box.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#b04a3e;color:#fff;padding:10px 12px;border-radius:8px;font-family:monospace;font-size:11px;line-height:1.4;white-space:pre-wrap;max-height:60vh;overflow:auto;box-shadow:0 4px 14px rgba(0,0,0,0.3)';
          document.body.appendChild(box);
        }
        box.textContent += msg + '\n';
      }
      window.__debugShowErr = showErr;
      window.addEventListener('error', function (e) {
        showErr('[エラー] ' + (e.message || '') + '\n  at ' + (e.filename || '?') + ':' + (e.lineno || '?') + ':' + (e.colno || '?'));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e.reason && (e.reason.stack || e.reason.message || e.reason) || '';
        showErr('[未処理Promise] ' + msg);
      });
    })();
  </script>

</body>
</html>
